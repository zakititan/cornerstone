name: Verify

on:
  pull_request:
  push:
    branches: [main, codex]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
